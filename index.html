document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    --font-sans: \"Golos Text\", -apple-system, \"Segoe UI\", sans-serif;\n  }\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body {\n    margin: 0; background: var(--white); color: var(--ink-900);\n    font-family: var(--font-sans); font-size: 16px; line-height: 1.55;\n    -webkit-font-smoothing: antialiased; overflow-x: hidden;\n  }\n  a { color: var(--purple-500); }\n  a:hover { color: var(--purple-700); }\n\n  /* ---------- progress ---------- */\n  .progress { position: fixed; inset: 0 0 auto 0; height: 4px; z-index: 50; background: var(--ink-200); }\n  .progress > span { display: block; height: 100%; width: 0; background: var(--purple-600); transition: width .25s var(--ease); }\n\n  /* ---------- hero ---------- */\n  .hero { position: relative; padding: 56px 16px 56px; }\n  .geo { display: none; }\n  .wrap { max-width: 880px; margin: 0 auto; }\n  .logo { display: block; height: 36px; width: auto; margin: 0 0 48px; }\n  .tag {\n    display: inline-block; font-size: 13px; font-weight: 500; line-height: 1.4;\n    padding: 6px 14px; border-radius: var(--radius-pill);\n    background: var(--lilac-100); color: var(--ink-900); margin-bottom: 24px;\n  }\n  h1 {\n    font-size: clamp(36px, 6vw, 56px); font-weight: 800; line-height: 1.12; letter-spacing: -.01em;\n    margin: 0 0 20px; max-width: 760px; text-wrap: balance;\n  }\n  .accent { color: var(--purple-600); }\n  .lead { color: var(--ink-500); font-size: 18px; line-height: 1.5; max-width: 640px; margin: 0 0 32px; text-wrap: pretty; }\n  .facts { display: flex; flex-wrap: wrap; gap: 12px; }\n  .fact { border-radius: var(--radius-xl); padding: 16px 20px; min-width: 150px; background: var(--lilac-100); }\n  .fact:nth-child(4n+2) { background: var(--yellow-100); }\n  .fact:nth-child(4n+3) { background: var(--mint-100); }\n  .fact:nth-child(4n+4) { background: var(--sky-100); }\n  .fact b { display: block; font-size: 28px; font-weight: 800; color: var(--ink-900); line-height: 1.15; letter-spacing: -.01em; }\n  .fact span { font-size: 14px; color: var(--ink-700); }\n\n  /* ---------- form ---------- */\n  main { padding: 0 16px 96px; }\n  .section {\n    background: var(--surface-tint); border-radius: var(--radius-2xl);\n    padding: 48px; margin-bottom: 24px;\n  }\n  .section-head { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }\n  .section-num {\n    font-size: 14px; font-weight: 700; color: var(--white); background: var(--ink-900);\n    border-radius: var(--radius-pill); padding: 4px 12px; flex: none; line-height: 1.3;\n  }\n  h2 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 700; letter-spacing: -.01em; line-height: 1.2; margin: 0; text-wrap: balance; }\n  .section-desc { color: var(--ink-500); margin: 8px 0; font-size: 16px; text-wrap: pretty; }\n\n  .q { padding: 24px 0 4px; border-top: 1px solid var(--ink-200); margin-top: 20px; }\n  .section-head + .q, .section-desc + .q, .scale-legend + .q { border-top: none; margin-top: 4px; }\n  .q-title { font-weight: 600; font-size: 18px; line-height: 1.4; margin: 0 0 4px; }\n  .q-title .n { color: var(--purple-600); font-weight: 600; margin-right: 8px; }\n  .q-hint { font-size: 14px; color: var(--ink-500); margin: 0 0 14px; }\n  .q-title + .opts, .q-title + input, .q-title + textarea { margin-top: 14px; }\n  .req { color: var(--purple-600); margin-left: 4px; }\n\n  .opts { display: grid; gap: 8px; }\n  .opt {\n    display: flex; gap: 12px; align-items: flex-start;\n    padding: 14px 16px; border: 1px solid transparent; border-radius: var(--radius-lg);\n    background: var(--white); box-shadow: var(--shadow-xs); cursor: pointer;\n    transition: border-color .12s var(--ease), background .12s var(--ease);\n  }\n  .opt:hover { border-color: var(--ink-200); }\n  .opt:has(input:checked) { border-color: var(--purple-600); background: var(--purple-50); }\n  .opt:has(input:disabled) { opacity: .55; cursor: not-allowed; }\n  .opt input { accent-color: var(--purple-600); width: 18px; height: 18px; margin: 2px 0 0; flex: none; }\n  .opt .other-input { margin-top: 8px; display: none; }\n  .opt:has(input:checked) .other-input { display: block; }\n  .opt-body { flex: 1; min-width: 0; }\n\n  input[type=text], input[type=tel], input[type=email], textarea {\n    width: 100%; font: inherit; color: var(--ink-900);\n    background: var(--white); border: 1px solid var(--ink-200); border-radius: var(--radius-md);\n    padding: 12px 16px; outline: none; transition: border-color .12s var(--ease), box-shadow .12s var(--ease);\n  }\n  textarea { min-height: 120px; resize: vertical; }\n  input[type=text]:focus, input[type=tel]:focus, input[type=email]:focus, textarea:focus { border-color: var(--purple-600); box-shadow: var(--shadow-focus); }\n  input::placeholder, textarea::placeholder { color: var(--ink-300); }\n\n  /* ---------- scales ---------- */\n  .scale-legend {\n    display: grid; gap: 6px; font-size: 14px; color: var(--ink-700);\n    background: var(--lilac-100); border-radius: var(--radius-lg); padding: 16px 20px; margin: 16px 0 8px;\n  }\n  .scale-legend b { color: var(--ink-900); display: inline-block; min-width: 18px; }\n  .group-label {\n    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;\n    color: var(--purple-600); margin: 32px 0 4px;\n  }\n  .srow {\n    display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;\n    padding: 14px 0; border-top: 1px solid var(--ink-200);\n  }\n  .srow .label { font-size: 16px; }\n  .srow .label .n { color: var(--purple-600); font-weight: 600; margin-right: 8px; }\n  .pills { display: flex; gap: 6px; }\n  .pill { position: relative; }\n  .pill input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }\n  .pill span {\n    display: grid; place-items: center; width: 44px; height: 44px;\n    border-radius: var(--radius-pill); background: var(--white); box-shadow: var(--shadow-xs);\n    border: 1px solid var(--ink-200);\n    font-weight: 600; color: var(--ink-500); transition: all .12s var(--ease);\n  }\n  .pill:hover span { border-color: var(--ink-900); color: var(--ink-900); }\n  .pill input:checked + span { background: var(--purple-600); border-color: var(--purple-600); color: var(--white); }\n  .pill input:focus-visible + span { box-shadow: var(--shadow-focus); }\n\n  .invalid .q-title, .srow.invalid .label { color: var(--error); }\n  .err-msg { color: var(--error); font-size: 14px; margin-top: 8px; display: none; }\n  .invalid > .err-msg { display: block; }\n  .limit-note { font-size: 13px; color: var(--ink-500); margin-top: 8px; }\n\n  /* ---------- submit ---------- */\n  .submit-card {\n    background: var(--purple-600); color: var(--white); border-radius: var(--radius-2xl);\n    padding: 48px; position: relative; overflow: hidden;\n  }\n  .submit-card::after {\n    content: \"\"; position: absolute; right: -120px; bottom: -110px; width: 480px; height: 337px;\n    background: url(\"19238d16-9b20-45f9-b1a7-665cadf40ca0\") no-repeat center / contain; pointer-events: none;\n  }\n  .submit-card h2 { margin-bottom: 8px; position: relative; z-index: 1; }\n  .submit-card p { color: var(--white); margin: 0 0 24px; max-width: 520px; position: relative; z-index: 1; }\n  .btn {\n    position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center;\n    background: var(--ink-900); color: var(--white); font: inherit; font-weight: 600; font-size: 16px; line-height: 1;\n    border: none; border-radius: var(--radius-pill); padding: 18px 32px; cursor: pointer;\n    transition: background .2s var(--ease), opacity .2s var(--ease);\n  }\n  .btn:hover { background: #000; color: var(--white); }\n  .btn:focus-visible { outline: none; box-shadow: var(--shadow-focus); }\n  .btn:disabled { opacity: .55; cursor: wait; }\n  .form-error { color: var(--white); margin-top: 16px; font-size: 15px; display: none; position: relative; z-index: 1; }\n\n  [hidden] { display: none !important; }\n  .schedule { display: grid; gap: 10px; margin-top: 16px; }\n  .day { display: grid; grid-template-columns: 104px 1fr; gap: 20px; align-items: center; padding: 20px 24px; }\n  .day-date { text-align: center; border-right: 1px solid var(--ink-200); padding-right: 16px; }\n  .day-date b { display: block; font-size: 44px; font-weight: 800; line-height: 1; color: var(--purple-600); letter-spacing: -.01em; }\n  .day-date span { font-size: 14px; color: var(--ink-500); }\n  .day-info { display: grid; gap: 4px; }\n  .day-wd { font-size: 14px; font-weight: 600; color: var(--purple-600); }\n  .day-title { font-weight: 700; font-size: 20px; line-height: 1.3; }\n  .day-sub { font-size: 14px; color: var(--ink-500); }\n  .intro-actions { margin-top: 28px; }\n  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }\n  .chips span {\n    font-size: 14px; padding: 8px 14px; border-radius: var(--radius-pill);\n    background: var(--white); box-shadow: var(--shadow-xs); color: var(--ink-900);\n  }\n  .goal, .takeaway { margin-top: 24px; padding: 24px; border-radius: var(--radius-xl); background: var(--white); box-shadow: var(--shadow-card); }\n  .goal p, .takeaway p { margin: 8px 0 0; }\n  .goal-label {\n    display: inline-block; font-size: 13px; font-weight: 600; line-height: 1.4;\n    padding: 4px 12px; border-radius: var(--radius-pill); background: var(--lilac-100); color: var(--ink-900);\n  }\n  .takeaway .goal-label { background: var(--mint-100); }\n  .session { margin-top: 16px; background: var(--white); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); overflow: hidden; }\n  .blocks { border-top: 1px solid var(--ink-200); padding: 4px 24px 8px; display: grid; }\n  .block { padding: 16px 0; border-top: 1px solid var(--ink-200); }\n  .block:first-child { border-top: none; }\n  .block-n {\n    display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.4;\n    color: var(--ink-900); background: var(--yellow-100); border-radius: var(--radius-pill); padding: 2px 10px; margin-right: 8px;\n    vertical-align: 2px;\n  }\n  .block b { font-size: 17px; font-weight: 700; }\n  .block p { margin: 6px 0 0; font-size: 15px; color: var(--ink-500); text-wrap: pretty; }\n  .block p.practice { color: var(--ink-900); }\n  .block p.practice::before { content: \"▸ \"; color: var(--purple-600); }\n  .split { margin: 20px 0 8px; }\n  .split-bar { height: 14px; border-radius: var(--radius-pill); background: var(--purple-200); overflow: hidden; }\n  .split-bar span { display: block; height: 100%; background: var(--purple-600); }\n  .split-legend { display: grid; gap: 6px; margin-top: 12px; font-size: 15px; color: var(--ink-700); }\n  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }\n  .sw-a { background: var(--purple-600); } .sw-b { background: var(--purple-200); }\n  .outcomes { list-style: none; padding: 0; margin: 16px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n  .outcomes li {\n    position: relative; padding: 18px 20px 18px 52px; font-size: 16px;\n    background: var(--white); border-radius: var(--radius-xl); box-shadow: var(--shadow-card);\n  }\n  .outcomes li::before {\n    content: \"✓\"; position: absolute; left: 18px; top: 18px; color: var(--white); background: var(--purple-600);\n    width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 800; display: grid; place-items: center;\n  }\n  .participation { background: var(--purple-50); }\n  .hero-cta { margin-top: 32px; text-decoration: none; }\n  #introForm { scroll-margin-top: 24px; }\n  @media (max-width: 640px) {\n    .outcomes { grid-template-columns: 1fr; }\n    .blocks { padding: 4px 18px 8px; }\n  }\n  .back {\n    background: none; border: none; color: var(--ink-500); font: inherit; font-size: 15px;\n    padding: 0; margin: 0 0 24px; cursor: pointer; display: block;\n  }\n  .back:hover { color: var(--purple-600); }\n  @media (max-width: 640px) {\n    .day { grid-template-columns: 1fr; gap: 8px; padding: 18px; }\n    .day-date { text-align: left; border-right: none; padding-right: 0; display: flex; align-items: baseline; gap: 8px; }\n    .day-date b { display: inline; font-size: 34px; }\n  }\n  .done { display: none; text-align: left; padding: 120px 16px; min-height: 80vh; }\n  .done h1 { margin-bottom: 20px; }\n  footer { background: var(--surface-dark); color: rgba(255,255,255,.85); font-size: 14px; text-align: center; padding: 32px 16px; }\n\n  @media (max-width: 640px) {\n    .hero { padding: 40px 16px 40px; }\n    .logo { height: 30px; margin-bottom: 32px; }\n    .section, .submit-card { padding: 28px 20px; border-radius: var(--radius-xl); }\n    .submit-card::after { width: 300px; height: 210px; right: -110px; bottom: -80px; }\n    .srow { grid-template-columns: 1fr; gap: 10px; }\n    .pills { justify-content: flex-start; }\n    .pill span { width: 48px; height: 48px; }\n    .lead { font-size: 16px; }\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"progress\" aria-hidden=\"true\"><span id=\"bar\"><\u002Fspan><\u002Fdiv>\n\n<!-- ================= СТОРІНКА 1: інформація + участь ================= -->\n<div id=\"introView\">\n  <header class=\"hero\">\n    <div class=\"geo\" aria-hidden=\"true\"><div class=\"a\"><\u002Fdiv><div class=\"b\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"wrap\">\n      <img class=\"logo\" src=\"86306d7e-da88-451c-8bc1-dcb951bbcdeb\" alt=\"DAN.IT Education\">\n      <span class=\"tag\">DAN.IT Education · Онлайн-тренінг · 6, 10, 13 листопада<\u002Fspan>\n      <h1>Онлайн-тренінг <span class=\"accent\">з фасилітації<\u002Fspan><\u002Fh1>\n      <p class=\"lead\">«Розвиток тренерських компетенцій та фасилітаційних навичок для ефективного проведення онлайн-тренінгів та групових сесій для дітей та дорослих»<\u002Fp>\n      <div class=\"facts\">\n        <div class=\"fact\"><b>3<\u002Fb><span>онлайн-сесії з 10:00<\u002Fspan><\u002Fdiv>\n        <div class=\"fact\"><b>10 год<\u002Fb><span>загальна тривалість<\u002Fspan><\u002Fdiv>\n        <div class=\"fact\"><b>60–65%<\u002Fb><span>практики<\u002Fspan><\u002Fdiv>\n        <div class=\"fact\"><b>✓<\u002Fb><span>сертифікат DAN.IT<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#introForm\" class=\"btn hero-cta\">Відповісти щодо участі ↓<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main>\n    <div class=\"wrap\">\n\n      <!-- Для кого і навіщо -->\n      <section class=\"section\">\n        <div class=\"section-head\"><h2>Для кого цей тренінг<\u002Fh2><\u002Fdiv>\n        <p class=\"section-desc\">Для психологів мобільних команд, спеціалістів відділу захисту, фахівців психологічної підтримки та інших спеціалістів, які проводять або планують проводити:<\u002Fp>\n        <div class=\"chips\">\n          <span>онлайн-групові психологічні заняття<\u002Fspan><span>групи підтримки<\u002Fspan><span>психоосвітні заходи<\u002Fspan>\n          <span>тренінги<\u002Fspan><span>групові сесії<\u002Fspan><span>круглі столи<\u002Fspan><span>фасилітовані обговорення<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"goal\">\n          <span class=\"goal-label\">Мета<\u002Fspan>\n          <p>Розвинути практичні тренерські та фасилітаційні компетенції, щоб впевнено, ефективно та безпечно проводити онлайн-групові заняття з використанням цифрових платформ.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Програма -->\n      <section class=\"section\">\n        <div class=\"section-head\"><h2>Програма та розклад<\u002Fh2><\u002Fdiv>\n        <p class=\"section-desc\">Усі сесії починаються о 10:00 за київським часом. Формат — онлайн, мова — українська.<\u002Fp>\n\n        <div class=\"session\">\n          <div class=\"day\">\n            <div class=\"day-date\"><b>6<\u002Fb><span>листопада<\u002Fspan><\u002Fdiv>\n            <div class=\"day-info\">\n              <span class=\"day-wd\">Пʼятниця · 10:00–13:00 · 3 год<\u002Fspan>\n              <span class=\"day-title\">Сесія 1. Основи ефективної онлайн-фасилітації<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"blocks\">\n            <div class=\"block\"><span class=\"block-n\">Блок 1<\u002Fspan><b>Особливості психологічної та групової роботи онлайн<\u002Fb>\n              <p>Відмінності онлайн- та офлайн-взаємодії, увага через екран, роль фасилітатора, структура сесії. Психологічно безпечний простір: правила, конфіденційність, етика, робота з сильними емоційними реакціями, стабілізація наприкінці заняття.<\u002Fp>\n              <p class=\"practice\">Практика: вправа «Безпечний простір», кейс «Сильна емоційна реакція учасника», моделювання відкриття сесії.<\u002Fp><\u002Fdiv>\n            <div class=\"block\"><span class=\"block-n\">Блок 2<\u002Fspan><b>Технічний інструментарій онлайн-тренера<\u002Fb>\n              <p>Zoom, Google Meet, Microsoft Teams: налаштування зустрічі, демонстрація екрану, чат, реакції, breakout rooms, запис. Онлайн-дошки: стікери, групування ідей, рефлексія, спільна робота в реальному часі.<\u002Fp>\n              <p class=\"practice\">Практика: кожен у ролі фасилітатора створює мінігрупи, дає завдання та організовує роботу на онлайн-дошці.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"session\">\n          <div class=\"day\">\n            <div class=\"day-date\"><b>10<\u002Fb><span>листопада<\u002Fspan><\u002Fdiv>\n            <div class=\"day-info\">\n              <span class=\"day-wd\">Вівторок · 10:00–13:00 · 3 год<\u002Fspan>\n              <span class=\"day-title\">Сесія 2. Залучення учасників та адаптація методик<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"blocks\">\n            <div class=\"block\"><span class=\"block-n\">Блок 3<\u002Fspan><b>Утримання уваги та залученість<\u002Fb>\n              <p>Чому увага онлайн падає швидше, чергування активностей, мікроінтерактиви, чат, реакції, опитування. Вимкнені камери й мовчання групи: як залучати без тиску. Швидкий зворотний зв'язок під час сесії.<\u002Fp>\n              <p class=\"practice\">Практика: кейси «80% камер вимкнено», «з 15 людей відповідають двоє»; створення власних онлайн-активаторів.<\u002Fp><\u002Fdiv>\n            <div class=\"block\"><span class=\"block-n\">Блок 4<\u002Fspan><b>Адаптація вправ з офлайн- в онлайн-формат<\u002Fb>\n              <p>Алгоритм адаптації у 8 кроків: від мети вправи до рефлексії. Знайомства, icebreakers, energizers, вправи на довіру, робота в парах і трійках. Як одна вправа змінюється для дітей, підлітків і дорослих.<\u002Fp>\n              <p class=\"practice\">Практика: адаптація реальної офлайн-вправи та презентація онлайн-версії групі.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"session\">\n          <div class=\"day\">\n            <div class=\"day-date\"><b>13<\u002Fb><span>листопада<\u002Fspan><\u002Fdiv>\n            <div class=\"day-info\">\n              <span class=\"day-wd\">Пʼятниця · 10:00–14:00 · 4 год<\u002Fspan>\n              <span class=\"day-title\">Сесія 3. Різні аудиторії та складні ситуації<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"blocks\">\n            <div class=\"block\"><span class=\"block-n\">Блок 5<\u002Fspan><b>Онлайн-заняття з дітьми та підлітками<\u002Fb>\n              <p>Вікові особливості уваги, тривалість активностей, ігрові елементи, зрозумілі інструкції, безпека та етика онлайн-роботи з дітьми.<\u002Fp>\n              <p class=\"practice\">Практика: «Одна тема — три аудиторії».<\u002Fp><\u002Fdiv>\n            <div class=\"block\"><span class=\"block-n\">Блок 6<\u002Fspan><b>Складні учасники та групова динаміка<\u002Fb>\n              <p>Домінуючий чи пасивний учасник, конфлікти, опір групи, відмова від вправи. Технічні збої — зв'язок, світло, звук — і план B.<\u002Fp>\n              <p class=\"practice\">Практика: рольове моделювання в трійках «учасник — фасилітатор — спостерігач».<\u002Fp><\u002Fdiv>\n            <div class=\"block\"><span class=\"block-n\">Блок 7<\u002Fspan><b>Власний банк інструментів фасилітатора<\u002Fb>\n              <p>Чек-листи підготовки та технічної перевірки, сценарії відкриття і завершення, банк вправ, карта ризиків онлайн-тренінгу.<\u002Fp>\n              <p class=\"practice\">Підсумкова практика: «Мінісесія онлайн-фасилітатора» зі структурованим зворотним зв'язком.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Як навчаємось -->\n      <section class=\"section\">\n        <div class=\"section-head\"><h2>Як проходить навчання<\u002Fh2><\u002Fdiv>\n        <p class=\"section-desc\">Принцип learning by doing — навчання через практику. Ви не лише слухаєте, а й самі проводите фрагменти онлайн-сесій.<\u002Fp>\n        <div class=\"split\">\n          <div class=\"split-bar\"><span style=\"width:37%\"><\u002Fspan><\u002Fdiv>\n          <div class=\"split-legend\"><span><i class=\"sw sw-a\"><\u002Fi>35–40% — мінілекції, пояснення, демонстрації<\u002Fspan><span><i class=\"sw sw-b\"><\u002Fi>60–65% — вправи, кейси, рольові моделювання, відпрацювання навичок<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"chips\">\n          <span>робота в парах і малих групах<\u002Fspan><span>breakout rooms<\u002Fspan><span>кейс-метод<\u002Fspan><span>рольові моделювання<\u002Fspan>\n          <span>онлайн-дошки<\u002Fspan><span>peer-to-peer feedback<\u002Fspan><span>групова рефлексія<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Результати -->\n      <section class=\"section\">\n        <div class=\"section-head\"><h2>Після тренінгу ви<\u002Fh2><\u002Fdiv>\n        <ul class=\"outcomes\">\n          <li>створюватимете психологічно безпечний простір у дистанційному форматі<\u002Fli>\n          <li>впевнено працюватимете в Zoom, Microsoft Teams і Google Meet, організовуватимете breakout rooms<\u002Fli>\n          <li>утримуватимете увагу групи та працюватимете з пасивністю й вимкненими камерами<\u002Fli>\n          <li>адаптуватимете офлайн-вправи для онлайну — для дітей, підлітків і дорослих<\u002Fli>\n          <li>матимете алгоритми роботи зі складними учасниками та груповою динамікою<\u002Fli>\n          <li>знатимете, що робити при технічних збоях<\u002Fli>\n        <\u002Ful>\n        <div class=\"takeaway\">\n          <span class=\"goal-label\">Ви отримаєте<\u002Fspan>\n          <p>Презентації та методичні рекомендації · чек-листи підготовки й технічної перевірки · сценарії відкриття та завершення сесії · банк інтерактивних вправ · алгоритми роботи зі складними учасниками · карту ризиків онлайн-тренінгу · <b>сертифікат<\u002Fb> про проходження 10-годинного тренінгу від DAN.IT Education.<\u002Fp>\n        <\u002Fdiv>\n        <p class=\"section-desc\" style=\"margin-top:16px\">Тренерка — Ксенія Столбова.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- Участь -->\n      <form class=\"section participation\" id=\"introForm\" novalidate=\"\">\n        <div class=\"section-head\"><h2>Ваша участь<\u002Fh2><\u002Fdiv>\n        <div class=\"q\" data-type=\"radio\" data-required=\"1\" id=\"qPart\">\n          <p class=\"q-title\">Чи плануєте ви взяти участь у тренінгу 6, 10 та 13 листопада?<span class=\"req\">*<\u002Fspan><\u002Fp>\n          <div class=\"opts\">\n            <label class=\"opt\"><input type=\"radio\" name=\"participation\" value=\"Так\"><span class=\"opt-body\">Так, планую взяти участь<\u002Fspan><\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"participation\" value=\"Ні\"><span class=\"opt-body\">Ні, не планую<\u002Fspan><\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"err-msg\">Оберіть варіант<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q\" id=\"qReason\" hidden=\"\">\n          <p class=\"q-title\">Якщо можете, підкажіть причину<\u002Fp>\n          <p class=\"q-hint\">За бажанням<\u002Fp>\n          <textarea id=\"pReason\" placeholder=\"Наприклад: не підходять дати\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div class=\"intro-actions\">\n          <button type=\"submit\" class=\"btn\" id=\"introBtn\">Далі — до реєстрації<\u002Fbutton>\n          <div class=\"form-error\" id=\"introError\" style=\"color:var(--error)\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<!-- ================= СТОРІНКА 2: реєстрація / опитувальник ================= -->\n<div id=\"formView\" hidden=\"\">\n  <header class=\"hero\">\n    <div class=\"geo\" aria-hidden=\"true\"><div class=\"a\"><\u002Fdiv><div class=\"b\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"wrap\">\n      <img class=\"logo\" src=\"86306d7e-da88-451c-8bc1-dcb951bbcdeb\" alt=\"DAN.IT Education\">\n      <button type=\"button\" class=\"back\" id=\"backBtn\">← Назад до інформації про тренінг<\u002Fbutton>\n      <span class=\"tag\">DAN.IT Education · Крок 2 з 2 · Реєстрація<\u002Fspan>\n      <h1>Розкажіть, що ви <span class=\"accent\">вже вмієте<\u002Fspan><\u002Fh1>\n      <p class=\"lead\">Цей опитувальник допоможе тренерці налаштувати програму саме під вашу групу. Тут немає правильних чи неправильних відповідей — це не тест і не оцінювання. Відповіді використовуються лише для підготовки тренінгу.<\u002Fp>\n      <div class=\"facts\">\n        <div class=\"fact\"><b>10–15<\u002Fb><span>хвилин на заповнення<\u002Fspan><\u002Fdiv>\n        <div class=\"fact\"><b>3<\u002Fb><span>коротких розділи<\u002Fspan><\u002Fdiv>\n        <div class=\"fact\"><b>10 год<\u002Fb><span>тренінгу, 3 сесії<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main>\n    <form id=\"survey\" class=\"wrap\" novalidate=\"\"><\u002Fform>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<section class=\"done wrap\" id=\"doneView\" aria-live=\"polite\">\n  <span class=\"tag\">Відповіді надіслано<\u002Fspan>\n  <h1>Дякуємо! <span class=\"accent\">До зустрічі<\u002Fspan> на тренінгу<\u002Fh1>\n  <p class=\"lead\">Вашу реєстрацію та відповіді отримано. Тренерка врахує їх під час підготовки сесій. Чекаємо вас 6 листопада о 10:00.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"done wrap\" id=\"declineView\" aria-live=\"polite\">\n  <span class=\"tag\">Відповідь надіслано<\u002Fspan>\n  <h1>Дякуємо, що <span class=\"accent\">повідомили<\u002Fspan><\u002Fh1>\n  <p class=\"lead\">Ми зафіксували, що ви не плануєте брати участь у цьому тренінгу. Якщо плани зміняться — просто заповніть форму ще раз.<\u002Fp>\n<\u002Fsection>\n\n<footer>© DAN.IT Education · Тренерка: Ксенія Столбова<\u002Ffooter>\n\n<script>\n/* =========================================================\n   СТРУКТУРА ОПИТУВАЛЬНИКА\n   type: radio | check | text | textarea | scale\n   key — назва колонки в Google Таблиці\n   ========================================================= */\nconst SURVEY = [\n  { title: \"Про вас\", items: [\n    { key: \"name\", n: \"\", type: \"text\", required: true, title: \"Ім'я та прізвище\", placeholder: \"Ім'я та прізвище\" },\n    { key: \"phone\", n: \"\", type: \"text\", inputType: \"tel\", check: \"phone\", required: true, title: \"Номер телефону\", placeholder: \"+380 67 123 45 67\", err: \"Вкажіть коректний номер телефону\" },\n    { key: \"email\", n: \"\", type: \"text\", inputType: \"email\", check: \"email\", required: true, title: \"Електронна пошта\", placeholder: \"name@example.com\", err: \"Вкажіть коректну адресу електронної пошти\" },\n    { key: \"1.1_role\", n: \"1.1\", type: \"radio\", required: true, title: \"Ваша посада / роль\", other: true, options: [\n      \"Психолог / психологиня мобільної команди\",\n      \"Спеціаліст / спеціалістка відділу захисту\",\n      \"Фахівець / фахівчиня психологічної підтримки\"]},\n    { key: \"1.2_experience\", n: \"1.2\", type: \"radio\", required: true, title: \"Загальний досвід проведення групових занять (офлайн і онлайн)\", options: [\n      \"Ще не проводив(ла), лише планую\", \"До 1 року\", \"1–3 роки\", \"Понад 3 роки\"]},\n    { key: \"1.3_formats\", n: \"1.3\", type: \"check\", required: true, title: \"Які формати ви проводите або плануєте проводити?\", hint: \"Можна обрати кілька\", other: true, options: [\n      \"Групові психологічні заняття\", \"Групи підтримки\", \"Психоосвітні заходи\", \"Тренінги\",\n      \"Круглі столи, фасилітовані обговорення\"]},\n    { key: \"1.4_audiences\", n: \"1.4\", type: \"check\", required: true, title: \"З якими аудиторіями ви працюєте?\", hint: \"Можна обрати кілька\", options: [\n      \"Діти (до 12 років)\", \"Підлітки (12–17 років)\", \"Дорослі\", \"Змішані групи (батьки з дітьми тощо)\"]},\n    { key: \"1.5_group_size\", n: \"1.5\", type: \"radio\", required: true, title: \"Якою зазвичай є чисельність ваших груп?\", options: [\n      \"До 6 осіб\", \"7–15 осіб\", \"16–30 осіб\", \"Понад 30 осіб\"]}\n  ]},\n  { title: \"Досвід онлайн-роботи з групами\", items: [\n    { key: \"2.1_online_sessions\", n: \"2.1\", type: \"radio\", required: true, title: \"Скільки онлайн-групових занять ви провели самостійно (як ведучий / ведуча)?\", options: [\n      \"Жодного\", \"1–5\", \"6–20\", \"Понад 20\"]},\n    { key: \"2.2_platforms\", n: \"2.2\", type: \"check\", required: true, title: \"Які платформи ви вже використовували як ведучий / ведуча (а не як учасник)?\", hint: \"Можна обрати кілька\", other: true, exclusive: \"Жодної\", options: [\n      \"Zoom\", \"Google Meet\", \"Microsoft Teams\", \"Онлайн-дошки (Miro, Padlet, Jamboard, Mural тощо)\",\n      \"Інтерактивні опитування (Mentimeter, Slido, Kahoot тощо)\", \"Жодної\"]},\n    { key: \"2.3_confidence\", n: \"2.3\", type: \"radio\", required: true, title: \"Як би ви описали свій нинішній рівень впевненості у веденні онлайн-груп?\", options: [\n      \"Початківець — переживаю, що щось піде не так\",\n      \"Базовий — проводжу, але за напрацьованим сценарієм і з напругою\",\n      \"Впевнений — спокійно веду, але хочу більше інструментів\",\n      \"Досвідчений — легко адаптуюся до групи і ситуації\"]},\n    { key: \"2.4_difficulties\", n: \"2.4\", type: \"check\", required: true, max: 3, title: \"Що для вас найскладніше в онлайн-форматі порівняно з офлайн?\", hint: \"Оберіть до 3 варіантів\", other: true, options: [\n      \"Технічна частина (платформи, демонстрація, breakout rooms)\",\n      \"Відчуття контакту з групою через екран\",\n      \"Утримання уваги та залученості\",\n      \"Вимкнені камери та мовчання групи\",\n      \"Створення психологічно безпечного простору\",\n      \"Реагування на сильні емоційні реакції\",\n      \"Адаптація офлайн-вправ до онлайну\",\n      \"Робота зі складними учасниками або конфліктами\",\n      \"Технічні збої (зв'язок, світло, звук)\",\n      \"Робота з дітьми та підлітками онлайн\"]}\n  ]},\n  { title: \"Очікування та запити\", items: [\n    { key: \"6.1_priorities\", n: \"6.1\", type: \"check\", required: true, max: 3, title: \"Які теми тренінгу для вас найважливіші?\", hint: \"Оберіть до 3 варіантів\", options: [\n      \"Психологічно безпечний онлайн-простір\",\n      \"Технічний інструментарій (Zoom, Meet, Teams, онлайн-дошки)\",\n      \"Утримання уваги та залученість\",\n      \"Адаптація офлайн-вправ до онлайну\",\n      \"Робота з дітьми та підлітками\",\n      \"Складні учасники та групова динаміка\",\n      \"Технічні ризики та план B\",\n      \"Готові чек-листи, сценарії та банк вправ\"]},\n    { key: \"6.2_case\", n: \"6.2\", type: \"textarea\", title: \"Опишіть ситуацію з вашої практики, яку ви хотіли б розібрати на тренінгу\", hint: \"За бажанням\" },\n    { key: \"6.3_success\", n: \"6.3\", type: \"textarea\", title: \"Що має змінитися у вашій роботі після тренінгу, щоб ви сказали: «це було корисно»?\" },\n    { key: \"6.4_mini_session\", n: \"6.4\", type: \"radio\", required: true, title: \"Чи готові ви провести короткий фрагмент сесії для колег під час підсумкової практики?\", options: [\n      \"Так, з радістю\", \"Так, але хвилююся\", \"Волів(ла) б роль спостерігача\"]},\n    { key: \"6.5_notes\", n: \"6.5\", type: \"textarea\", title: \"Чи є щось, що тренерці варто знати наперед?\", hint: \"Технічні обмеження, пристрій, з якого ви будете підключатися, особливі побажання\" }\n  ]}\n];\n\n/* ================= рендер ================= */\nconst form = document.getElementById('survey');\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nlet uid = 0;\n\nfunction renderItem(it) {\n  if (it.type === 'scale') return renderScale(it);\n  const id = 'f' + (uid++);\n  let h = `<div class=\"q\" data-key=\"${esc(it.key)}\" data-type=\"${it.type}\"${it.required ? ' data-required=\"1\"' : ''}${it.max ? ` data-max=\"${it.max}\"` : ''}>`;\n  h += `<p class=\"q-title\">${it.n ? `<span class=\"n\">${it.n}<\u002Fspan>` : ''}${esc(it.title)}${it.required ? '<span class=\"req\" aria-label=\"обовʼязково\">*<\u002Fspan>' : ''}<\u002Fp>`;\n  if (it.hint) h += `<p class=\"q-hint\">${esc(it.hint)}<\u002Fp>`;\n  if (it.type === 'text') {\n    h += `<input type=\"${it.inputType || 'text'}\" id=\"${id}\" data-check=\"${it.check || ''}\" name=\"${esc(it.key)}\" placeholder=\"${esc(it.placeholder || '')}\">`;\n  } else if (it.type === 'textarea') {\n    h += `<textarea id=\"${id}\" name=\"${esc(it.key)}\" placeholder=\"Ваша відповідь\"><\u002Ftextarea>`;\n  } else {\n    const t = it.type === 'radio' ? 'radio' : 'checkbox';\n    h += '<div class=\"opts\">';\n    it.options.forEach(o => {\n      h += `<label class=\"opt\"><input type=\"${t}\" name=\"${esc(it.key)}\" value=\"${esc(o)}\"${it.exclusive === o ? ' data-exclusive=\"1\"' : ''}><span class=\"opt-body\">${esc(o)}<\u002Fspan><\u002Flabel>`;\n    });\n    if (it.other) {\n      h += `<label class=\"opt\"><input type=\"${t}\" name=\"${esc(it.key)}\" value=\"__other__\"><span class=\"opt-body\">Інше<input type=\"text\" class=\"other-input\" data-other-for=\"${esc(it.key)}\" placeholder=\"Уточніть\"><\u002Fspan><\u002Flabel>`;\n    }\n    h += '<\u002Fdiv>';\n    if (it.max) h += `<p class=\"limit-note\" data-limit>Обрано 0 з ${it.max}<\u002Fp>`;\n  }\n  h += `<div class=\"err-msg\">${it.type === 'check' ? 'Оберіть хоча б один варіант' : it.type === 'radio' ? 'Оберіть варіант' : (it.err || 'Будь ласка, дайте відповідь')}<\u002Fdiv>`;\n  return h + '<\u002Fdiv>';\n}\n\nfunction scaleRow(key, n, label, values) {\n  const name = `${n}`;\n  let h = `<div class=\"srow\" data-scale=\"${esc(name)}\"><div class=\"label\"><span class=\"n\">${n}<\u002Fspan>${esc(label)}<\u002Fdiv><div class=\"pills\" role=\"radiogroup\" aria-label=\"${esc(n + ' ' + label)}\">`;\n  values.forEach(v => { h += `<label class=\"pill\"><input type=\"radio\" name=\"${esc(name)}\" value=\"${v}\"><span>${v}<\u002Fspan><\u002Flabel>`; });\n  return h + '<\u002Fdiv><\u002Fdiv>';\n}\nfunction renderScale(it) {\n  let h = '<div class=\"scale\">';\n  if (it.rows) it.rows.forEach(r => h += scaleRow(it.key, r[0], r[1], it.values));\n  if (it.groups) it.groups.forEach(g => {\n    h += `<div class=\"group-label\">${esc(g[0])}<\u002Fdiv>`;\n    g[1].forEach(r => h += scaleRow(it.key, r[0], r[1], it.values));\n  });\n  return h + '<\u002Fdiv>';\n}\n\nlet html = '';\nSURVEY.forEach((s, i) => {\n  html += `<section class=\"section\"><div class=\"section-head\"><span class=\"section-num\">${String(i+1).padStart(2,'0')}<\u002Fspan><h2>${esc(s.title)}<\u002Fh2><\u002Fdiv>`;\n  if (s.desc) html += `<p class=\"section-desc\">${esc(s.desc)}<\u002Fp>`;\n  if (s.legend) html += `<div class=\"scale-legend\">${s.legend.map(l => `<div><b>${l[0]}<\u002Fb> — ${esc(l[1])}<\u002Fdiv>`).join('')}<\u002Fdiv>`;\n  s.items.forEach(it => html += renderItem(it));\n  html += '<\u002Fsection>';\n});\nhtml += `<div class=\"submit-card\"><h2>Готово?<\u002Fh2><p>Перевірте відповіді та надішліть. Дані потраплять лише до тренерки.<\u002Fp>\n  <button type=\"submit\" class=\"btn\" id=\"submitBtn\">Надіслати відповіді<\u002Fbutton>\n  <div class=\"form-error\" id=\"formError\"><\u002Fdiv><\u002Fdiv>`;\nform.innerHTML = html;\n\n/* ================= поведінка ================= */\nform.addEventListener('change', e => {\n  const inp = e.target;\n  const q = inp.closest('.q');\n  if (q && q.dataset.type === 'check') {\n    const boxes = [...q.querySelectorAll('input[type=checkbox]')];\n    if (inp.dataset.exclusive && inp.checked) boxes.forEach(b => { if (b !== inp) b.checked = false; });\n    else if (inp.checked) boxes.forEach(b => { if (b.dataset.exclusive) b.checked = false; });\n    const max = +q.dataset.max;\n    if (max) {\n      const n = boxes.filter(b => b.checked).length;\n      if (n > max) { inp.checked = false; }\n      const cnt = boxes.filter(b => b.checked).length;\n      q.querySelector('[data-limit]').textContent = `Обрано ${cnt} з ${max}`;\n      boxes.forEach(b => { if (!b.checked) b.disabled = cnt >= max; });\n    }\n  }\n  if (inp.closest('.invalid')) inp.closest('.invalid').classList.remove('invalid');\n  updateProgress();\n});\nform.addEventListener('input', e => {\n  if (e.target.classList.contains('other-input')) {\n    const box = e.target.closest('.opt').querySelector('input[type=radio],input[type=checkbox]');\n    if (e.target.value && !box.checked) { box.checked = true; box.dispatchEvent(new Event('change', {bubbles:true})); }\n  }\n  const inv = e.target.closest('.invalid'); if (inv) inv.classList.remove('invalid');\n  updateProgress();\n});\n\nfunction collect() {\n  const data = {\n    \"Участь у тренінгу\": (document.querySelector('input[name=participation]:checked') || {}).value || '',\n    \"Причина відмови\": partValue() === 'Ні' ? document.getElementById('pReason').value.trim() : ''\n  };\n  SURVEY.forEach(s => s.items.forEach(it => {\n    if (it.type === 'scale') {\n      const rows = it.rows || it.groups.flatMap(g => g[1]);\n      rows.forEach(r => {\n        const c = form.querySelector(`input[name=\"${r[0]}\"]:checked`);\n        data[`${r[0]} ${r[1]}`] = c ? Number(c.value) : '';\n      });\n      return;\n    }\n    const col = it.n ? `${it.n} ${it.title}` : it.title;\n    if (it.type === 'text' || it.type === 'textarea') {\n      data[col] = form.querySelector(`[name=\"${it.key}\"]`).value.trim();\n    } else {\n      const vals = [...form.querySelectorAll(`input[name=\"${it.key}\"]:checked`)].map(i => {\n        if (i.value !== '__other__') return i.value;\n        const t = form.querySelector(`[data-other-for=\"${it.key}\"]`).value.trim();\n        return 'Інше: ' + (t || '—');\n      });\n      data[col] = vals.join('; ');\n    }\n  }));\n  return data;\n}\n\nfunction validate() {\n  let first = null;\n  form.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));\n  form.querySelectorAll('.q[data-required]').forEach(q => {\n    const t = q.dataset.type;\n    let ok;\n    if (t === 'text' || t === 'textarea') { const el = q.querySelector('input,textarea'); const v = el.value.trim(); ok = v !== '' && (el.dataset.check !== 'email' || /^[^ @]+@[^ @]+[.][^ @]+$/.test(v)) && (el.dataset.check !== 'phone' || v.replace(/[^0-9]/g, '').length >= 10); }\n    else ok = !!q.querySelector('input:checked');\n    if (!ok) { q.classList.add('invalid'); first = first || q; }\n  });\n  form.querySelectorAll('.srow').forEach(r => {\n    if (!r.querySelector('input:checked')) { r.classList.add('invalid'); first = first || r; }\n  });\n  return first;\n}\n\nfunction updateProgress() {\n  const req = [...form.querySelectorAll('.q[data-required], .srow')];\n  const done = req.filter(el => {\n    if (el.classList.contains('srow')) return !!el.querySelector('input:checked');\n    const t = el.dataset.type;\n    if (t === 'text' || t === 'textarea') return el.querySelector('input,textarea').value.trim() !== '';\n    return !!el.querySelector('input:checked');\n  }).length;\n  document.getElementById('bar').style.width = (req.length ? done / req.length * 100 : 0) + '%';\n}\n\nform.addEventListener('submit', async e => {\n  e.preventDefault();\n  const errBox = document.getElementById('formError');\n  errBox.style.display = 'none';\n  const bad = validate();\n  if (bad) {\n    bad.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    errBox.textContent = 'Будь ласка, заповніть обовʼязкові питання — вони підсвічені червоним.';\n    errBox.style.display = 'block';\n    return;\n  }\n  send(document.getElementById('submitBtn'), 'Надіслати відповіді', errBox, 'doneView');\n});\n\n/* ---------- відправка в Google Таблицю ---------- */\nasync function send(btn, btnLabel, errBox, doneId) {\n  const cfg = window.SURVEY_CONFIG;\n  if (!cfg.endpoint || cfg.endpoint.indexOf('PASTE_') === 0) {\n    errBox.textContent = 'Форма ще не підключена до Google Таблиці (не вказано адресу Apps Script).';\n    errBox.style.display = 'block';\n    return;\n  }\n  btn.disabled = true; btn.textContent = 'Надсилаємо…';\n  const payload = { formId: cfg.formId, submittedAt: new Date().toISOString(), answers: collect() };\n  try {\n    // text/plain → «простий» запит без CORS-preflight, який Apps Script приймає\n    await fetch(cfg.endpoint, {\n      method: 'POST', mode: 'no-cors',\n      headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n      body: JSON.stringify(payload)\n    });\n    showView(doneId);\n  } catch (err) {\n    btn.disabled = false; btn.textContent = btnLabel;\n    errBox.textContent = 'Не вдалося надіслати. Перевірте інтернет і спробуйте ще раз.';\n    errBox.style.display = 'block';\n  }\n}\n\n/* ---------- перемикання сторінок ---------- */\nfunction showView(id) {\n  ['introView', 'formView'].forEach(v => document.getElementById(v).hidden = (v !== id));\n  ['doneView', 'declineView'].forEach(v => document.getElementById(v).style.display = (v === id ? 'block' : 'none'));\n  document.querySelector('.progress').style.display = (id === 'formView') ? 'block' : 'none';\n  if (id === 'doneView') document.getElementById('bar').style.width = '100%';\n  window.scrollTo({ top: 0 });\n}\n\n/* ---------- сторінка 1 ---------- */\nconst introForm = document.getElementById('introForm');\nconst introBtn = document.getElementById('introBtn');\nfunction partValue() { return (introForm.querySelector('input[name=participation]:checked') || {}).value; }\nintroForm.addEventListener('change', () => {\n  const v = partValue();\n  document.getElementById('qReason').hidden = v !== 'Ні';\n  introBtn.textContent = v === 'Ні' ? 'Надіслати відповідь' : 'Далі — до реєстрації';\n  document.getElementById('qPart').classList.remove('invalid');\n});\nintroForm.addEventListener('submit', e => {\n  e.preventDefault();\n  const err = document.getElementById('introError'); err.style.display = 'none';\n  const v = partValue();\n  document.getElementById('qPart').classList.toggle('invalid', !v);\n  if (!v) return;\n  if (v === 'Ні') send(introBtn, 'Надіслати відповідь', err, 'declineView');\n  else { showView('formView'); updateProgress(); }\n});\ndocument.getElementById('backBtn').addEventListener('click', () => showView('introView'));\n\nshowView('introView');\nupdateProgress();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
